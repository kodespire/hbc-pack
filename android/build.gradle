// React Native (Android) library. The module is C++: cpp/ over native/hbcpack.c and the
// bundled zstd/brotli sources, compiled into the app by CMakeLists.txt next to this file
// (see react-native.config.js). This project only runs codegen and provides the
// package class that autolinking looks for.
apply plugin: "com.android.library"
apply plugin: "com.facebook.react"

def safeExtGet(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace "com.kodespire.hbcpack"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
  }
}

// Must match codegenConfig in ../package.json.
react {
  libraryName = "KodespireHbcPackSpec"
  codegenJavaPackageName = "com.kodespire.hbcpack"
}

dependencies {
  implementation "com.facebook.react:react-android"
}
